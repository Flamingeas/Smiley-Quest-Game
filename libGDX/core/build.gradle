plugins {
    id 'java'
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.10"
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:1.12.1"
    implementation "com.badlogicgames.gdx:gdx-freetype:1.12.1"

    // Import local JAR because the library is no longer hosted online
    implementation files("libs/gdx-video-core.jar")

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'

    testImplementation "com.badlogicgames.gdx:gdx-backend-headless:1.12.1"

    testImplementation "com.badlogicgames.gdx:gdx-backend-headless:1.12.1"
    testImplementation "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-desktop"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }

    classDirectories.setFrom(
            fileTree(dir: 'build/classes/java/main', include: '**/*.class')
    )
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(fileTree(dir: 'build/jacoco', include: '**/*.exec'))
}
